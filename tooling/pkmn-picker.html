  <title>Pixelmon Model Viewer</title>

  <style>
    body, html {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Roboto', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      width: 100vw;
      max-width: 100vw;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.5rem;
    }

    input[type="text"] {
      z-index: 100;
      box-sizing: border-box;
      background: #232323;
      position: relative;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1.1rem;
      color: #e0e0e0;
      width: 100%;
      outline: none;
      box-shadow: 0 2px 8px 0 rgba(0,0,0,0.18);
      transition: border 0.2s, box-shadow 0.2s;
    }
    
    input[type="text"]:focus {
      border: 2px solid #bb86fc;
      box-shadow: 0 4px 16px 0 rgba(98,0,234,0.12);
      background: #26243a;
    }

    .main {
      display: flex;
      gap: 16px;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .input-container {
      position: relative;
      width: 100%;
    }

    #autocomplete-list {
      position: absolute;
      box-sizing: border-box;
      left: 0;
      top: 100%;
      width: 99%;
      z-index: 99;
      background: #232323;
      border: 1.5px solid #bb86fc;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 6px 24px 0 rgba(0,0,0,0.24);
      max-height: 260px;
      overflow-y: auto;
      transform: translateY(-4px) translateX(.5%);
    }

    button {
      width: 75%;
      background: #6200ea;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 1.2rem;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #3700b3;
    }

    .wrapper {
      height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      position: relative;
    }
    #history-bar {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 18px;
      height: 100px;
      min-height: 100px;
      max-width: 100vw;
      overflow-x: auto;
      padding: 14px 32px 14px 18px;
      margin-bottom: 18px;
      position: relative;
      background: linear-gradient(90deg, #7c3aed 60%, #a084e8 100%);
      border-radius: 22px;
      box-shadow: 0 6px 24px 0 rgba(98,0,234,0.16);
    }
    .hidden { display: none !important; }
    .history-sprite {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #f3eaff;
      box-shadow: 0 2px 10px 0 rgba(98,0,234,0.10);
      border: 2.5px solid #bb86fc;
      object-fit: contain;
      margin-right: 6px;
      opacity: 0;
      animation: fadeIn 0.5s forwards;
      transition: box-shadow 0.2s, border 0.2s;
      cursor: pointer;
    }
    .history-sprite:last-child {
      border: 2.5px solid #6200ea;
      box-shadow: 0 0 0 3px #6200ea44;
    }
    .history-sprite:hover {
      border: 2.5px solid #fff;
      box-shadow: 0 0 0 3px #bb86fc44;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

    <div class="footer">

    // History bar logic
    const history = [];
    function updateHistoryBar() {
      const bar = document.getElementById('history-bar');
      bar.innerHTML = '';
      if (history.length === 0) {
        bar.classList.add('hidden');
        return;
      } else {
        bar.classList.remove('hidden');
      }
      for (let i = Math.max(0, history.length - 15); i < history.length; i++) {
        const dex = history[i];
        const img = document.createElement('img');
        img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${dex}.png`;
        img.className = 'history-sprite';
        img.title = pokedex.find(p => p.national_dex === dex)?.pkmn || `#${dex}`;
        img.alt = img.title;
        img.addEventListener('click', () => {
          document.getElementById('pokemonInput').value = img.title;
          openModel(img.title);
        });
        bar.appendChild(img);
      }
    }

    function openModel(inputOverride) {
      const input = (typeof inputOverride === 'string') ? inputOverride.trim() : document.getElementById('pokemonInput').value.trim();
      let number = parseInt(input, 10);
      if (isNaN(number)) {
        // Try to match by name (case-insensitive)
        const match = pokedex.find(
          p => p.pkmn.toLowerCase() === input.toLowerCase()
        );
        if (match) number = match.national_dex;
      }
      if (isNaN(number) || number < 1) {
        alert('Please enter a valid Pokémon name or number.');
        return;
      }
      // Update history (unique only, move to end if already present)
      const idx = history.indexOf(number);
      if (idx !== -1) {
        history.splice(idx, 1);
      }
      const modelId = 25754 + number;
      if(number > 149) {
        number = number - 2;
      }
      history.push(number);
      updateHistoryBar();
      const url = `https://www.models-resource.com/mobile/pokemonquest/model/${modelId}/`;
      window.open(url, '_blank');
    }
    // On load, initialize bar
    updateHistoryBar();

    // Simple autocomplete
    const input = document.getElementById('pokemonInput');
    const autocompleteList = document.getElementById('autocomplete-list');
    let lastSuggestions = [];
    input.addEventListener('input', function() {
      const val = this.value;
      autocompleteList.innerHTML = '';
      if (!val) {
        lastSuggestions = [];
        return false;
      }
      const suggestions = pokedex.filter(p =>
        p.pkmn.toLowerCase().startsWith(val.toLowerCase()) ||
        p.national_dex.toString().startsWith(val)
      );
      lastSuggestions = suggestions.slice(0, 8);
      lastSuggestions.forEach(p => {
        const item = document.createElement('div');
        const nationalDexNr = p.national_dex > 149 ? p.national_dex - 2 : p.national_dex;
        item.innerHTML = `<strong>${p.pkmn}</strong> <span style='color:#aaa'>(#${nationalDexNr})</span>`;
        item.style.background = '#232323';
        item.style.padding = '6px 10px';
        item.style.cursor = 'pointer';
        item.style.transition = 'background 0.16s, color 0.16s, border-left 0.16s';
        item.addEventListener('mouseenter', function() {
          item.style.background = '#2a1846';
          item.style.color = '#bb86fc';
          item.style.borderLeft = '4px solid #bb86fc';
        });
        item.addEventListener('mouseleave', function() {
          item.style.background = '#232323';
          item.style.color = '#e0e0e0';
          item.style.borderLeft = '4px solid transparent';
        });
        item.style.borderLeft = '4px solid transparent';
        item.addEventListener('mousedown', function(e) {
          input.value = p.pkmn;
          autocompleteList.innerHTML = '';
        });
        autocompleteList.appendChild(item);
      });
    });
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        if (lastSuggestions.length > 0) {
          input.value = lastSuggestions[0].pkmn;
          autocompleteList.innerHTML = '';
          openModel();
          e.preventDefault();
        }
      }
    });
    document.addEventListener('click', function(e) {
      if (e.target !== input) autocompleteList.innerHTML = '';
    });
